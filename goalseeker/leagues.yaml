# Divisions published by football-data.co.uk, using that site's own division codes.
# Set active: false to stop showing a league.
# group: leagues fitted together, so promoted and relegated teams keep their history.
# tier: 1 = top flight. Used for the "promoted this season" note.
# If the source starts publishing a division that is not listed here, the sync log says so.
leagues:
  - {code: E0,  name: Premier League,       country: England,     group: ENG, tier: 1, active: true}
  - {code: E1,  name: Championship,         country: England,     group: ENG, tier: 2, active: true}
  - {code: E2,  name: League One,           country: England,     group: ENG, tier: 3, active: true}
  - {code: E3,  name: League Two,           country: England,     group: ENG, tier: 4, active: true}
  - {code: EC,  name: National League,      country: England,     group: ENG, tier: 5, active: true}
  - {code: SC0, name: Premiership,          country: Scotland,    group: SCO, tier: 1, active: true}
  - {code: SC1, name: Championship,         country: Scotland,    group: SCO, tier: 2, active: true}
  - {code: SC2, name: League One,           country: Scotland,    group: SCO, tier: 3, active: true}
  - {code: SC3, name: League Two,           country: Scotland,    group: SCO, tier: 4, active: true}
  - {code: D1,  name: Bundesliga,           country: Germany,     group: GER, tier: 1, active: true}
  - {code: D2,  name: 2. Bundesliga,        country: Germany,     group: GER, tier: 2, active: true}
  - {code: I1,  name: Serie A,              country: Italy,       group: ITA, tier: 1, active: true}
  - {code: I2,  name: Serie B,              country: Italy,       group: ITA, tier: 2, active: true}
  - {code: SP1, name: La Liga,              country: Spain,       group: ESP, tier: 1, active: true}
  - {code: SP2, name: Segunda Division,     country: Spain,       group: ESP, tier: 2, active: true}
  - {code: F1,  name: Ligue 1,              country: France,      group: FRA, tier: 1, active: true}
  - {code: F2,  name: Ligue 2,              country: France,      group: FRA, tier: 2, active: true}
  - {code: N1,  name: Eredivisie,           country: Netherlands, group: NED, tier: 1, active: true}
  - {code: B1,  name: Pro League,           country: Belgium,     group: BEL, tier: 1, active: true}
  - {code: P1,  name: Primeira Liga,        country: Portugal,    group: POR, tier: 1, active: true}
  - {code: T1,  name: Super Lig,            country: Turkey,      group: TUR, tier: 1, active: true}
  - {code: G1,  name: Super League,         country: Greece,      group: GRE, tier: 1, active: true}
