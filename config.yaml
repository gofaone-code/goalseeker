# GoalSeeker settings.
# Edit this file on GitHub (open it, click the pencil icon, change a number, "Commit changes").
# Changes apply from the next scheduled run. Picks already made are never changed.

# --- Staking ---
bankroll_units: 100        # your bankroll, measured in units (1 unit = whatever amount you choose)
kelly_fraction: 0.25       # 0.25 = quarter Kelly. Lower = smaller, safer stakes
max_stake_pct: 0.03        # never stake more than this share of the bankroll on one pick (0.03 = 3%)
stake_step_units: 0.25     # stakes are rounded to this step

# --- When does a price become a pick? ---
edge_threshold: 0.04       # model probability must beat the bookmaker's fair probability by 4 points
min_model_probability: 0.50
min_odds: 1.30
max_edge: 0.15             # "edges" bigger than this are almost always a model error, not a gift.
                           # They are shown with a warning but never become picks.

# --- Markets and bookmakers ---
markets: [ou]              # ou = over/under goals. Add 1x2 to also pick home/draw/away: [ou, 1x2]
bettable_bookmakers: [B365, BFE]   # B365 = Bet365, BFE = Betfair Exchange
betfair_commission: 0.05   # taken off Betfair Exchange winnings before any maths

# --- Timing ---
window_days: 7             # how far ahead fixtures are shown
today_hours: 48            # the Today screen covers this many hours
pick_cutoff_minutes: 30    # no new picks this close to kickoff
void_after_days: 10        # a pick with no result this long after kickoff is voided (postponed/abandoned)

# --- Data-quality guards ---
min_team_matches: 10       # each team needs this many matches in the last 400 days, else "insufficient data"
min_sample_for_breakdown: 20   # Record breakdowns with fewer settled picks than this are hidden

# --- Statistical model (Dixon-Coles) ---
model:
  version: dc-1.0
  seasons_of_history: 3    # seasons of results the model learns from (plus the current one)
  half_life_days: 365      # a match this many days old counts half as much as one played today
  prior_sd: 0.30           # pulls teams with little data toward their division's average (smaller = stronger pull)
  shots_weight: 0.5        # 0 = rate teams on goals only; 0.5 = half goals, half shots on target
  # These three were chosen by how well the model predicted 2025/26 scorelines (not by profit).
  max_goals: 10
  uncertainty_draws: 400

# --- Backtest (re-run weekly; kept completely separate from the live record) ---
backtest:
  enabled: true
  seasons: 1               # how many past seasons to replay
  refit_every_days: 7
  draws: 200
